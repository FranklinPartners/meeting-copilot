<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeetingCopilot – Lokaler KI-Notizassistent</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Header & API-Key -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-700 pb-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
          <span>🎙️</span> MeetingCopilot
        </h1>
        <p class="text-sm text-slate-400">Diskreter Browser-Assistent für Mitschriften und Protokolle</p>
      </div>

      <div class="w-full md:w-auto flex flex-col sm:flex-row items-center gap-2">
        <input 
          id="apiKeyInput" 
          type="password" 
          placeholder="Gemini API Key eingeben" 
          class="bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 w-full sm:w-64"
        />
        <button 
          onclick="saveApiKey()" 
          class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs px-3 py-1.5 rounded transition text-slate-200 w-full sm:w-auto"
        >
          Key speichern
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

      <!-- Linke Spalte: Audio / Mitschrift -->
      <section class="bg-slate-800/60 border border-slate-700 rounded-xl p-5 flex flex-col h-[700px]">
        <div class="flex items-center justify-between pb-3 border-b border-slate-700/60">
          <div class="flex items-center gap-2">
            <span id="recordingIndicator" class="h-3 w-3 rounded-full bg-slate-500"></span>
            <span id="recordingStatus" class="text-xs font-medium text-slate-400">Bereit</span>
          </div>
          <div class="flex gap-2">
            <button 
              onclick="insertDemoData()" 
              class="text-xs text-slate-400 hover:text-white px-2 py-1 rounded bg-slate-700/40 hover:bg-slate-700 transition"
            >
              Demo-Text laden
            </button>
            <button 
              onclick="clearTranscript()" 
              class="text-xs text-slate-400 hover:text-red-400 px-2 py-1 rounded bg-slate-700/40 hover:bg-slate-700 transition"
            >
              Leeren
            </button>
          </div>
        </div>

        <div class="flex gap-2 my-4">
          <button 
            id="micToggleBtn" 
            onclick="toggleSpeechRecognition()" 
            class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg text-sm flex items-center justify-center gap-2 transition"
          >
            <span>🔴</span> <span id="micBtnText">Live-Mithören starten</span>
          </button>
        </div>

        <div class="flex-1 flex flex-col">
          <label class="text-xs font-semibold text-slate-400 mb-1">Mitschrift / Rohtext:</label>
          <textarea 
            id="transcriptArea" 
            placeholder="Gesprochener Text erscheint hier automatisch über das Mikrofon. Alternativ kannst du jederzeit Notizen direkt hier eintippen..."
            class="flex-1 w-full bg-slate-900/80 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 placeholder-slate-600 resize-none focus:outline-none focus:border-indigo-500 font-mono"
          ></textarea>
        </div>

        <button 
          id="analyzeBtn" 
          onclick="analyzeTranscript()" 
          class="mt-4 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2"
        >
          <span>✨</span> Meeting auswerten & Protokoll erstellen
        </button>
      </section>

      <!-- Rechte Spalte: KI-Protokoll & Action Items -->
      <section class="bg-slate-800/60 border border-slate-700 rounded-xl p-5 flex flex-col h-[700px]">
        <div class="flex items-center justify-between pb-3 border-b border-slate-700/60">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Ergebnisprotokoll</span>
          <button 
            onclick="copyOutput()" 
            class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1 rounded transition"
          >
            Kopieren
          </button>
        </div>

        <div 
          id="outputContainer" 
          class="flex-1 overflow-y-auto mt-4 p-4 bg-slate-900/80 border border-slate-700 rounded-lg text-sm text-slate-300 leading-relaxed whitespace-pre-wrap font-sans"
        >Hier erscheint nach dem Klick auf „Meeting auswerten“ die strukturierte Zusammenfassung mit To-dos, Fristen und Verantwortlichen.</div>
      </section>

    </div>
  </div>

  <script>
    let recognition = null;
    let isListening = false;

    // Gespeicherten Key beim Laden abrufen
    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('GEMINI_KEY');
      if (savedKey) {
        document.getElementById('apiKeyInput').value = savedKey;
      }
      initSpeechRecognition();
    });

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (!key) {
        alert('Bitte gib einen gültigen Gemini API-Key ein.');
        return;
      }
      localStorage.setItem('GEMINI_KEY', key);
      alert('API-Key lokal im Browser gespeichert!');
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        document.getElementById('recordingStatus').innerText = 'Spracherkennung wird von diesem Browser nicht unterstützt (bitte Chrome nutzen).';
        document.getElementById('micToggleBtn').disabled = true;
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'de-DE';

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('recordingIndicator').className = 'h-3 w-3 rounded-full bg-red-500 animate-pulse';
        document.getElementById('recordingStatus').innerText = 'Hört aktiv mit...';
        document.getElementById('micBtnText').innerText = 'Mithören stoppen';
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('recordingIndicator').className = 'h-3 w-3 rounded-full bg-slate-500';
        document.getElementById('recordingStatus').innerText = 'Pausiert / Bereit';
        document.getElementById('micBtnText').innerText = 'Live-Mithören starten';
      };

      recognition.onresult = (event) => {
        let finalTrans = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTrans += event.results[i][0].transcript + ' ';
          }
        }
        if (finalTrans) {
          const area = document.getElementById('transcriptArea');
          area.value += (area.value ? ' ' : '') + finalTrans.trim();
          area.scrollTop = area.scrollHeight;
        }
      };

      recognition.onerror = (err) => {
        console.error('Spracherkennungsfehler:', err);
        document.getElementById('recordingStatus').innerText = 'Fehler: ' + err.error;
      };
    }

    function toggleSpeechRecognition() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function clearTranscript() {
      document.getElementById('transcriptArea').value = '';
    }

    function insertDemoData() {
      document.getElementById('transcriptArea').value = 
`Teilnehmer: Anna (Projektleiterin), Markus (Entwickler), Sarah (Design).
Anna: Wir müssen über das Release von Version 2 sprechen. Sarah, wie weit ist der Checkout-Screen?
Sarah: Die Entwürfe sind fertig, ich brauche aber noch Feedback bis Freitag, 14 Uhr.
Markus: Ich übernehme die Anbindung an die Datenbank. Das dauert etwa 3 Tage. Ich brauche dafür die API-Doku von Michael bis morgen Abend.
Anna: Alles klar. Wir beschließen, dass der Release-Termin um eine Woche verschoben wird auf den 15. November. 
Markus, klärst du das mit dem Kunden ab?
Markus: Ja, mache ich heute noch per Mail.`;
    }

    async function analyzeTranscript() {
      const key = localStorage.getItem('GEMINI_KEY') || document.getElementById('apiKeyInput').value.trim();
      const transcript = document.getElementById('transcriptArea').value.trim();
      const output = document.getElementById('outputContainer');

      if (!key) {
        alert('Bitte trage zuerst oben rechts deinen Gemini API-Key ein.');
        return;
      }
      if (!transcript) {
        alert('Kein Text vorhanden! Bitte lasse das Mikrofon mitlaufen oder tippe Notizen ein.');
        return;
      }

      output.innerText = 'Analysiere Mitschrift mit Gemini... Bitte kurz warten.';

      const systemPrompt = `Du bist ein präziser Executive-Meeting-Assistent. 
Erstelle aus dem vorliegenden Rohtext / der Mitschrift ein sauberes deutsches Meeting-Protokoll mit folgender Struktur:

1. EXECUTIVE SUMMARY (Kurze Zusammenfassung der wichtigsten Gesprächsinhalte in 2-3 Sätzen)
2. BESCHLÜSSE & ENTSCHEIDUNGEN (Konkrete Beschlüsse)
3. ACTION ITEMS & AUFGABEN (Jede Aufgabe mit: Wer? Was? Bis wann?)
4. OFFENE FRAGEN / RISIKEN (Falls vorhanden)

Halte dich strikt an die Fakten des Textes und erfinde keine Details.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [
              {
                role: 'user',
                parts: [
                  { text: systemPrompt + '\n\nHIER IST DIE MITSCRIFT:\n' + transcript }
                ]
              }
            ]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          output.innerText = data.candidates[0].content.parts[0].text;
        } else {
          output.innerText = 'Fehler bei der Auswertung: ' + JSON.stringify(data);
        }
      } catch (err) {
        output.innerText = 'Verbindungsfehler: ' + err.message;
      }
    }

    function copyOutput() {
      const text = document.getElementById('outputContainer').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert('Protokoll in die Zwischenablage kopiert!');
      });
    }
  </script>
</body>
</html>
